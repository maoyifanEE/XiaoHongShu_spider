[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-profile-exporter"
version = "0.1.0"
description = "Low-frequency read-only Xiaohongshu public profile exporter."
requires-python = ">=3.12"
dependencies = [
  "playwright==1.46.0",
  "PyYAML==6.0.2",
  "openpyxl==3.1.5",
  "tzdata==2026.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.2",
]

[tool.setuptools.packages.find]
where = ["src"]
